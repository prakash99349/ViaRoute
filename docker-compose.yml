# ViaRoute on a one-port platform (xCloud "Deploy via Git", Coolify, CapRover, …).
# The platform gives the HTTPS domain and forwards it to port 8080 here; a small gateway serves:
#   https://<APP_DOMAIN>/        web app        https://<APP_DOMAIN>/api/…  API (carrier webhooks too)
#   https://<APP_DOMAIN>/mail/   test inbox (user "admin", password MAIL_UI_PASSWORD)
#
# Only three settings are needed (on xCloud: turn on "Environment File" and paste them):
#   APP_DOMAIN=royal-dream.1wp.site     the domain the platform gives the app (no https://)
#   ADMIN_EMAIL=you@example.com         first Super Admin, created on start-up
#   ADMIN_PASSWORD=a-long-password      12+ characters; also the test inbox password (user "admin")
# JWT_SECRET and ENCRYPTION_KEY are generated on first start and kept in the "secrets" volume.
# The database is only reachable inside this stack; set POSTGRES_PASSWORD before the first start to choose its password.
#
# For your own server with automatic HTTPS for every customer subdomain and custom domain, use
# infra/docker-compose.prod.yml instead.

name: viaroute

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser calls the API on the same address (…/api), so any portal host works.
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ROOT_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is not set. On xCloud turn on Environment File and add APP_DOMAIN, ADMIN_EMAIL and ADMIN_PASSWORD}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # Platform proxy + our gateway.
      TRUST_PROXY_HOPS: 2
      DATABASE_URL: postgresql://viaroute:${POSTGRES_PASSWORD:-viaroute-internal-db}@postgres:5432/viaroute?schema=public
      REDIS_URL: redis://redis:6379
      # Main-site address; the web and API addresses are worked out from it.
      APP_DOMAIN: ${APP_DOMAIN}
      # One domain only: any address that isn't a customer portal opens the main site.
      UNKNOWN_HOST_IS_MAIN_SITE: "true"
      # Empty = generated once and kept in the secrets volume.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SECRETS_DIR: /app/secrets
      # First admin, created on start-up if missing (change the password after logging in).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Email: the built-in test inbox unless you set a real SMTP server (e.g. Resend).
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-ViaRoute <no-reply@viaroute.test>}
      # Carriers are added in Admin → Carriers; until then the Test carrier simulates calls.
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      STORAGE_DIR: /app/storage
    volumes:
      - recordings:/app/storage
      - secrets:/app/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viaroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viaroute-internal-db}
      POSTGRES_DB: viaroute
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaroute"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Test inbox for sign-up / invite / reset emails, at https://<APP_DOMAIN>/mail/
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail/
      MP_UI_AUTH: admin:${MAIL_UI_PASSWORD:-${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set (it also protects the test inbox)}}

volumes:
  pgdata:
  redisdata:
  recordings:
  secrets:
